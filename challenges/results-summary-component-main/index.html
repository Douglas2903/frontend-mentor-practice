<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  
  <title>Frontend Mentor | Results summary component</title>

</head>
<body>
  <main>
    <article class="container">
      <section class="result-section">
        <h2>Your Result</h2>
        <div class="score-box">
          <span class="current-score">76</span>
          <span class="max-score">of 100</span>
        </div>
        <h3>Great</h3>
        <p>You scored higher than 65% of the people who have taken these tests.</p>
      </section>
    
      <section class="summary-section">
        <h2>Summary</h2>
        <div class="summary-box">
          <div class="summary-item reaction">
            <div class="attribute-img-text">
              <img src="assets/images/icon-reaction.svg" alt="" width="20" height="20">
              <span class="attribute">Reaction</span>
            </div>
            <div class="attribute-score">
              <span class="attribute-current-score">80</span>
              <span class="attribute-max-score">/ 100</span>
            </div>
          </div>
          <div class="summary-item memory">
            <div class="attribute-img-text">
              <img src="assets/images/icon-memory.svg" alt="" width="20" height="20">
              <span class="attribute">Memory</span>
            </div>
            <div class="attribute-score">
              <span class="attribute-current-score">92</span>
              <span class="attribute-max-score">/100</span>
            </div>
          </div>
          <div class="summary-item verbal">
            <div class="attribute-img-text">
              <img src="assets/images/icon-verbal.svg" alt="" width="20" height="20">
              <span class="attribute">Verbal</span>
            </div>
            <div class="attribute-score">
              <span class="attribute-current-score">61</span>
              <span class="attribute-max-score">/100</span>
            </div>
          </div>
          <div class="summary-item visual">
            <div class="attribute-img-text">
              <img src="assets/images/icon-visual.svg" alt="" width="20" height="20">
              <span class="attribute">Visual</span>
            </div>
            <div class="attribute-score">
              <span class="attribute-current-score">72</span>
              <span class="attribute-max-score">/100</span>
            </div>
          </div>
        </div>
        <button class="continue-button">Continue</button>
      </section>
    </article>
  </main>
</body>
</html>
