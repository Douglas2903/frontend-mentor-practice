<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="style.css" />

    <title>Frontend Mentor | Social proof section</title>
  </head>
  <body>
    <main>
      <section class="introduction">
        <h1>10,000+ of our users love our products.</h1>
        <p>
          We only provide great products combined with excellent customer
          service. See what our satisfied customers are saying about our
          services.
        </p>

        <div class="rate-section">
          <div class="rate-box">
            <div class="stars-image">
              <img src="images/icon-star.svg" alt="" width="17" height="16" />
              <img src="images/icon-star.svg" alt="" width="17" height="16" />
              <img src="images/icon-star.svg" alt="" width="17" height="16" />
              <img src="images/icon-star.svg" alt="" width="17" height="16" />
              <img src="images/icon-star.svg" alt="" width="17" height="16" />
            </div>
            <p>Rated 5 Stars in Reviews</p>
          </div>
          <div class="rate-box">
            <div class="stars-image">
              <img src="images/icon-star.svg" alt="" width="17" height="16" />
              <img src="images/icon-star.svg" alt="" width="17" height="16" />
              <img src="images/icon-star.svg" alt="" width="17" height="16" />
              <img src="images/icon-star.svg" alt="" width="17" height="16" />
              <img src="images/icon-star.svg" alt="" width="17" height="16" />
            </div>
            <p>Rated 5 Stars in Report Guru</p>
          </div>
          <div class="rate-box">
            <div class="stars-image">
              <img src="images/icon-star.svg" alt="" width="17" height="16" />
              <img src="images/icon-star.svg" alt="" width="17" height="16" />
              <img src="images/icon-star.svg" alt="" width="17" height="16" />
              <img src="images/icon-star.svg" alt="" width="17" height="16" />
              <img src="images/icon-star.svg" alt="" width="17" height="16" />
            </div>
            <p>Rated 5 Stars in BestTech</p>
          </div>
        </div>
      </section>

      <section class="card-section">
        <div class="card">
          <figure>
            <figcaption class="profile-buyer">
              <div class="img-profile">
                <img src="images/image-colton.jpg" alt="Colton Smith" width="80" height="80" />
              </div>
              <div class="profile-infos">
                <span class="name-buyer">Colton Smith</span>
                <span class="verified-buyer">Verified Buyer</span>
              </div>
            </figcaption>
            <blockquote>
              <q
                >We needed the same printed design as the one we had ordered a
                week prior. Not only did they find the original order, but we
                also received it in time. Excellent!</q
              >
            </blockquote>
          </figure>
        </div>

        <div class="card">
          <figure>
            <figcaption class="profile-buyer">
              <div class="img-profile">
                <img src="images/image-irene.jpg" alt="Irene Roberts" width="80" height="80" />
              </div>
              <div class="profile-infos">
                <span class="name-buyer">Irene Roberts</span>
                <span class="verified-buyer">Verified Buyer</span>
              </div>
            </figcaption>
            <blockquote>
              <q
                >Customer service is always excellent and very quick turn
                around. Completely delighted with the simplicity of the purchase
                and the speed of delivery.</q
              >
            </blockquote>
          </figure>
        </div>

        <div class="card">
          <figure>
            <figcaption class="profile-buyer">
              <div class="img-profile">
                <img src="images/image-anne.jpg" alt="Anne Wallace" width="80" height="80" />
              </div>
              <div class="profile-infos">
                <span class="name-buyer">Anne Wallace</span>
                <span class="verified-buyer">Verified Buyer</span>
              </div>
            </figcaption>
            <blockquote>
              <q
                >Put an order with this company and can only praise them for the
                very high standard. Will definitely use them again and recommend
                them to everyone!</q
              >
            </blockquote>
          </figure>
        </div>
      </section>
    </main>
  </body>
</html>
