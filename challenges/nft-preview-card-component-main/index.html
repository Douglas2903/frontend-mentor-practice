<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  
  <title>Frontend Mentor | NFT preview card component</title>

</head>
<body>
  <main>
    <article class="container">
      <div class="image">
        <img src="images/image-equilibrium.jpg" alt="Equilibrium #3429 artwork" width="604" height="604">
      </div>
      <div class="content">
        <h1>Equilibrium #3429</h1>
        <p>Our Equilibrium collection promotes balance and calm.</p>
        <div class="eth-days-box">
          <div class="item">
            <img src="images/icon-ethereum.svg" alt="" width="11" height="18">
            <span class="eth">0.041 ETH</span>
          </div>
          <div class="item">
            <img src="images/icon-clock.svg" alt="" width="17" height="17">
            <span class="days">3 days left</span>
          </div>
        </div>
        <div class="profile-box">
          <img src="images/image-avatar.png" alt="Jules Wyvern" width="132" height="132">
          <span>Creation of Jules Wyvern</span>
        </div>
      </div>
    </article>
  </main>
</body>
</html>
