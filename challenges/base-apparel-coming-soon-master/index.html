<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script defer src="index.js"></script>

    <title>Frontend Mentor | Base Apparel coming soon page</title>
  </head>
  <body>
    <header class="header">
      <img
        src="images/logo.svg"
        alt="Base Apparel"
        width="158"
        height="33"
        class="header__logo"
      />
    </header>
    <picture class="hero">
      <source
        media="(min-width: 1280px)"
        srcset="images/hero-desktop.jpg"
        width="610"
        height="800"
      />
      <img
        src="images/hero-mobile.jpg"
        alt=""
        width="375"
        height="250"
        class="hero__image"
      />
    </picture>
    <main class="intro">
      <h1 class="intro__title">
        <span class="intro__highlight">We're</span> coming soon
      </h1>
      <p class="intro__text">
        Hello fellow shoppers! We're currently building our new fashion store.
        Add your email below to stay up-to-date with announcements and our
        launch deals.
      </p>
      <form class="signup" novalidate>
        <label for="email__input" class="visually-hidden">Email Address</label>
        <input
          class="signup__input"
          type="email"
          name="email__input"
          id="email__input"
          placeholder="Email Address"
          autocomplete="email"
          aria-describedby="email-error"
        />

        <button type="submit" class="signup__button">
          <img src="images/icon-arrow.svg" alt="Subscribe" width="12" height="20" />
        </button>
        <p id="email-error" class="signup__error" aria-live="polite"></p>
      </form>
    </main>
  </body>
</html>
