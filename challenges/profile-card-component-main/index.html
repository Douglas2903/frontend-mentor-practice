<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  
  <title>Frontend Mentor | Profile card component</title>
</head>
<body>
  <main>
    <article class="container">
      <div class="image">
        <img src="images/image-victor.jpg" alt="Victor Crest" width="96" height="96">
      </div>
      <div class="personal-infos-box">
        <div class="name-age">
          <h1>Victor Crest</h1>
          <span class="age">26</span>
        </div>
        <address class="city">London</address>
      </div>
      <div class="stats-box">
        <div class="item">
          <span class="stats">80K</span>
          <span class="text">Followers</span>
        </div>
        <div class="item">
          <span class="stats">803K</span>
          <span class="text">Likes</span>
        </div>
        <div class="item">
          <span class="stats">1.4K</span>
          <span class="text">Photos</span>
        </div>
      </div>
    </article>
  </main>
</body>
</html>
